version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: fitlab-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate() }"
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: fitlab-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
    container_name: fitlab-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  # End-to-end tests (Playwright). Not started by `docker compose up`; run with:
  #   docker compose --profile e2e run --rm e2e
  # Keep the image tag in sync with @playwright/test in e2e/package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    profiles: ["e2e"]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    environment:
      BASE_URL: ${BASE_URL:-http://frontend}
      CI: ${CI:-}
    ipc: host
    depends_on:
      - frontend
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && npx playwright test"]

volumes:
  mongo-data:
  e2e-node-modules:
